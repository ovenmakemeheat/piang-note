# Adapted from Alchemy v0.91.2's bin/services/github-workflow.ts template.
# See also https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run --filter web build
